<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ServPlus - Cadastro de Serviços de Campo</title>

    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Aplicativo de alta performance para técnicos de campo registrarem instalações, manutenções, localização GPS e ganhos." />

    <!-- Web App Manifest -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Chrome & Android Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ServPlus" />

    <!-- Apple iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ServPlus" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />

    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-TileImage" content="./icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="shortcut icon" href="./icon-192.png" />
    <script type="module" crossorigin src="./assets/index-CfzvtPbF.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BfSVYyIc.css">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>

    <!-- Early PWA Prompt Capture & Service Worker Lifecycle -->
    <script>
      window.deferredPwaPrompt = null;
      window.isAppInstalled = false;

      // Detecta se já está em modo standalone (já instalado)
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        window.isAppInstalled = true;
      }

      // Captura o evento nativo de instalação do Chrome (Android / Desktop)
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        console.log('[PWA] beforeinstallprompt capturado com sucesso');
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });

      // Captura a confirmação de instalação realizada
      window.addEventListener('appinstalled', function() {
        window.deferredPwaPrompt = null;
        window.isAppInstalled = true;
        console.log('[PWA] Aplicativo instalado com sucesso no dispositivo!');
        window.dispatchEvent(new Event('pwa-installed'));
      });

      // Registro do Service Worker
      if ('serviceWorker' in navigator) {
        var registerSW = function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] ServiceWorker registrado com sucesso:', reg.scope);
            })
            .catch(function(err) {
              console.error('[PWA] Falha ao registrar ServiceWorker:', err);
            });
        };

        if (document.readyState === 'complete') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
  </body>
</html>

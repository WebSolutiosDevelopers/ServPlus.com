<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo Circular Teal -->
  <circle cx="256" cy="256" r="250" fill="#00B59C" />

  <!-- Monitor e Base (Fundo/Atrás do App) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base do Monitor -->
    <rect x="186" y="392" width="140" height="24" rx="4" stroke-width="11" />
    <!-- Haste do Monitor -->
    <path d="M 238 346 V 392 M 274 346 V 392" stroke-width="11" />
    
    <!-- Moldura do Monitor (Telão atrás) -->
    <!-- Corpo Principal do Monitor -->
    <rect x="110" y="165" width="292" height="181" rx="14" stroke-width="11" />
    <!-- Linha Divisória do Painel do Monitor -->
    <line x1="110" y1="320" x2="402" y2="320" stroke-width="11" />
  </g>

  <!-- Botões de LED/Status no canto inferior do monitor -->
  <g fill="#FFFFFF">
    <rect x="342" y="328" width="18" height="8" rx="4" />
    <rect x="368" y="328" width="18" height="8" rx="4" />
  </g>

  <!-- Janela Flutuante do App (Frente) -->
  <!-- Fundo preenchido com #00B59C para encobrir as linhas do monitor que passam por trás -->
  <rect x="146" y="92" width="220" height="204" rx="20" fill="#00B59C" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round" />

  <!-- Cabeçalho da Janela -->
  <line x1="146" y1="130" x2="366" y2="130" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />
  
  <!-- 3 pílulas do cabeçalho da janela -->
  <g fill="#FFFFFF">
    <rect x="168" y="107" width="22" height="8" rx="4" />
    <rect x="198" y="107" width="22" height="8" rx="4" />
    <rect x="228" y="107" width="22" height="8" rx="4" />
  </g>

  <!-- Conteúdo Interno da Janela -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Card do Perfil / Avatar (Lado Esquerdo) -->
    <rect x="160" y="142" width="122" height="138" rx="16" stroke-width="10" />

    <!-- Cabeça e Cabelo -->
    <circle cx="221" cy="178" r="21" stroke-width="10" />
    <!-- Franja/Cabelo -->
    <path d="M 205 170 C 210 162 225 160 235 174" stroke-width="9" />

    <!-- Ombro e V-Neck -->
    <path d="M 172 278 V 250 C 172 234 188 230 200 230 H 242 C 254 230 270 234 270 250 V 278" stroke-width="10" />
    <path d="M 208 230 L 221 245 L 234 230" stroke-width="10" />

    <!-- Lado Direito: Botão/Tag Superior e 4 linhas de dados -->
    <rect x="296" y="152" width="46" height="28" rx="6" stroke-width="10" />

    <line x1="290" y1="200" x2="350" y2="200" stroke-width="10" />
    <line x1="290" y1="222" x2="350" y2="222" stroke-width="10" />
    <line x1="290" y1="244" x2="350" y2="244" stroke-width="10" />
    <line x1="290" y1="266" x2="350" y2="266" stroke-width="10" />
  </g>
</svg>
